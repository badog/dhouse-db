name: Deploy CI4

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ci4-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy CodeIgniter 4 to Production
    runs-on: ubuntu-latest

    env:
      DEPLOY_PATH: /home/dhouse-db/www
      DEPLOY_URL: ${{ secrets.DEPLOY_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, pdo_pgsql
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Prepare writable directories
        run: |
          mkdir -p \
            writable/cache \
            writable/logs \
            writable/session \
            writable/uploads \
            writable/debugbar
          chmod -R u+rwX writable

      - name: Set base URL for CI bootstrap
        run: printf '%s\n' 'app.baseURL = "http://localhost/"' > .env

      - name: Check CI4 application bootstrap
        run: php spark routes

      - name: Pack release
        run: |
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./tests' \
            --exclude='./phpunit.dist.xml' \
            --exclude='./writable/cache/*' \
            --exclude='./writable/logs/*' \
            --exclude='./writable/session/*' \
            --exclude='./writable/uploads/*' \
            --exclude='./writable/debugbar/*' \
            -czf "$RUNNER_TEMP/ci4-release.tar.gz" .

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_URL:-}" ]; then
            echo "DEPLOY_URL secret is required to configure CI4 app.baseURL."
            exit 1
          fi

          PORT="${DEPLOY_PORT:-22}"
          ARCHIVE="ci4-release-${GITHUB_SHA}.tar.gz"
          printf -v DEPLOY_URL_Q '%q' "$DEPLOY_URL"

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH' && test -w '$DEPLOY_PATH'"

          scp \
            -i ~/.ssh/deploy_key \
            -P "$PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/ci4-release.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/$ARCHIVE"

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' ARCHIVE='$ARCHIVE' DEPLOY_URL=$DEPLOY_URL_Q bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          test -f "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$DEPLOY_PATH"
          rm -f "$ARCHIVE"

          test -f public/index.php
          test -f spark
          test -f vendor/autoload.php
          test -w writable
          test -f .env

          DEPLOY_URL="$DEPLOY_URL" php -r '
          $url = getenv("DEPLOY_URL");
          if (filter_var($url, FILTER_VALIDATE_URL) === false) {
              fwrite(STDERR, "DEPLOY_URL must be a complete URL, such as https://example.com/\n");
              exit(1);
          }

          $path = ".env";
          $contents = is_file($path) ? file_get_contents($path) : "";
          $line = "app.baseURL = " . var_export($url, true);
          $pattern = "/^[ \\t]*#?[ \\t]*app\\.baseURL[ \\t]*=.*$/m";

          if (preg_match($pattern, $contents) === 1) {
              $contents = preg_replace($pattern, $line, $contents, 1);
          } else {
              $contents = rtrim($contents) . "\n" . $line . "\n";
          }

          if (file_put_contents($path, $contents) === false) {
              fwrite(STDERR, "Could not update .env app.baseURL.\n");
              exit(1);
          }
          '

          php spark routes > /dev/null
          echo "CI4 release deployed and bootstrap verified."
          REMOTE

      - name: Check deployed site
        if: success()
        run: |
          if [ -z "${DEPLOY_URL:-}" ]; then
            echo "DEPLOY_URL secret is not set; skipping HTTP health check."
            exit 0
          fi

          for attempt in $(seq 1 20); do
            CURL_ERROR_FILE="$RUNNER_TEMP/deploy-health-curl-error.txt"
            HTTP_CODE="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 "$DEPLOY_URL" 2>"$CURL_ERROR_FILE" || true)"
            if [[ "$HTTP_CODE" =~ ^[23][0-9][0-9]$ ]]; then
              echo "Site responded with HTTP $HTTP_CODE."
              exit 0
            fi
            echo "Waiting for site response... ($attempt/20; HTTP ${HTTP_CODE:-000})"
            if [ -s "$CURL_ERROR_FILE" ]; then
              sed 's/^/curl: /' "$CURL_ERROR_FILE"
            fi
            sleep 3
          done

          echo "Site health check failed for DEPLOY_URL."
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          echo "### CI4 deployment successful" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: main" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Path: $DEPLOY_PATH" >> "$GITHUB_STEP_SUMMARY"
